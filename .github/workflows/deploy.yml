name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要的权限，不要用 write-all
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，新提交取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 测试不过就不部署
      - name: Test
        run: npm test

      # base 从仓库名推导：项目页为 /<repo>/，用户页（<user>.github.io）则为 /
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # 注意：这里不能加 enablement: true。
      # GITHUB_TOKEN 没有创建 Pages 站点的权限（会报 Resource not accessible by
      # integration），首次必须由仓库管理员在 Settings → Pages 把 Source 设为
      # GitHub Actions，只做一次，之后本步骤只读取站点配置。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
